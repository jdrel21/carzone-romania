<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CarZone Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#111827;
}

.wrap{
  width:min(1200px,94%);
  margin:auto;
  padding:25px 0 50px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap:10px;
}

h1{margin:0;font-size:32px}
h2{margin-top:0}

.header-buttons{
  display:flex;
  gap:8px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  cursor:pointer;
  font-size:15px;
}

.primary{
  background:#2563eb;
  color:white;
}

.gray{
  background:#e5e7eb;
  color:#111;
}

.red{
  background:#dc2626;
  color:white;
}

.green{
  background:#16a34a;
  color:white;
}

.orange{
  background:#f59e0b;
  color:white;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:white;
  border-radius:16px;
  padding:18px;
}

.stat-title{
  color:#6b7280;
  font-size:14px;
}

.stat-number{
  font-size:28px;
  font-weight:bold;
  margin-top:7px;
}

.add-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:10px;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  background:white;
  font-size:16px;
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.product{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:16px;
}

.product-icon{
  font-size:35px;
}

.product-name{
  font-size:18px;
  font-weight:bold;
  margin:8px 0 12px;
}

.product-fields{
  display:grid;
  gap:7px;
}

.product-buttons{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px;
}

.order{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
}

.order-title{
  font-weight:bold;
  font-size:18px;
}

.order-info{
  background:#f9fafb;
  border-radius:10px;
  padding:12px;
  margin-top:12px;
}

.order-info p{
  margin:6px 0;
}

.order-item{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #eee;
  padding:8px 0;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:19px;
  font-weight:bold;
  margin-top:12px;
}

.message{
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.ok{
  background:#dcfce7;
  color:#166534;
}

.loading{
  color:#6b7280;
  padding:10px 0;
}

@media(max-width:900px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

  .add-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:600px){

  .wrap{
    width:94%;
  }

  .header{
    flex-direction:column;
    align-items:stretch;
  }

  .header-buttons button{
    flex:1;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .products{
    grid-template-columns:1fr;
  }

  .add-grid{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<div class="wrap">

<div class="header">

<div>
<h1>CarZone Admin</h1>
<p>Panoul de administrare</p>
</div>

<div class="header-buttons">

<button
class="gray"
onclick="loadAll()">
🔄 Actualizează
</button>

<button
class="red"
onclick="logout()">
🚪 Ieșire
</button>

</div>

</div>


<!-- STATISTICI -->

<div class="stats">

<div class="stat">
<div class="stat-title">Produse</div>
<div id="statProducts" class="stat-number">0</div>
</div>

<div class="stat">
<div class="stat-title">Produse active</div>
<div id="statActive" class="stat-number">0</div>
</div>

<div class="stat">
<div class="stat-title">Comenzi</div>
<div id="statOrders" class="stat-number">0</div>
</div>

<div class="stat">
<div class="stat-title">Vânzări</div>
<div id="statSales" class="stat-number">0 lei</div>
</div>

</div>


<!-- ADAUGARE -->

<div class="card">

<h2>➕ Adaugă produs</h2>

<div class="add-grid">

<input
id="name"
placeholder="Nume produs">

<input
id="price"
type="number"
step="0.01"
placeholder="Preț lei">

<input
id="stock"
type="number"
placeholder="Stoc">

<input
id="icon"
placeholder="Emoji 🚗">

</div>

<button
class="primary"
onclick="addProduct()"
style="margin-top:10px">

Adaugă produs

</button>

<div id="productMessage"></div>

</div>


<!-- PRODUSE -->

<div class="card">

<h2>📦 Produse</h2>

<div id="products">
Se încarcă produsele...
</div>

</div>


<!-- COMENZI -->

<div class="card">

<h2>🛒 Comenzi</h2>

<div id="orders">
Se încarcă comenzile...
</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../config.js"></script>

<script>

var cfg = window.CARZONE_CONFIG;

var sb = window.supabase.createClient(
  cfg.SUPABASE_URL,
  cfg.SUPABASE_ANON_KEY
);

var products = [];
var orders = [];
var orderItems = [];


/* =========================
   UTILITARE
========================= */

function money(value){

  return Number(value || 0).toLocaleString(
    "ro-RO",
    {
      style:"currency",
      currency:"RON"
    }
  );

}


function esc(value){

  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function dateFormat(value){

  if(!value) return "-";

  return new Date(value).toLocaleString(
    "ro-RO"
  );

}


/* =========================
   PRODUSE
========================= */

async function loadProducts(){

  var result = await sb
    .from("products")
    .select("*")
    .order("created_at",{ascending:false});

  if(result.error){

    document.getElementById("products").innerHTML =
      '<div class="message error">' +
      esc(result.error.message) +
      '</div>';

    console.error(result.error);

    return;

  }

  products = result.data || [];

  renderProducts();

}


function renderProducts(){

  var el =
    document.getElementById("products");

  if(products.length === 0){

    el.innerHTML =
      '<div class="loading">Nu există produse.</div>';

    return;

  }

  var html = '<div class="products">';

  products.forEach(function(p){

    html += `

      <div class="product">

        <div class="product-icon">
          ${esc(p.icon || "🚗")}
        </div>

        <div class="product-name">
          ${esc(p.name)}
        </div>

        <div class="product-fields">

          <input
            id="name_${p.id}"
            value="${esc(p.name)}"
            placeholder="Nume">

          <input
            id="price_${p.id}"
            type="number"
            step="0.01"
            value="${p.price}">

          <input
            id="stock_${p.id}"
            type="number"
            value="${p.stock}">

          <input
            id="icon_${p.id}"
            value="${esc(p.icon || "🚗")}"
            placeholder="Emoji">

        </div>

        <p>
          ${p.active
            ? '<span style="color:#16a34a">● Activ</span>'
            : '<span style="color:#dc2626">● Dezactivat</span>'
          }
        </p>

        <div class="product-buttons">

          <button
            class="primary"
            onclick="saveProduct('${p.id}')">
            💾 Salvează
          </button>

          <button
            class="${p.active ? "red" : "green"}"
            onclick="toggleProduct('${p.id}',${p.active})">
            ${p.active ? "Dezactivează" : "Activează"}
          </button>

        </div>

      </div>

    `;

  });

  html += "</div>";

  el.innerHTML = html;

}


/* =========================
   ADAUGĂ PRODUS
========================= */

async function addProduct(){

  var name =
    document.getElementById("name").value.trim();

  var price =
    Number(document.getElementById("price").value);

  var stock =
    Number(document.getElementById("stock").value);

  var icon =
    document.getElementById("icon").value.trim() || "🚗";

  var message =
    document.getElementById("productMessage");


  if(!name){

    message.innerHTML =
      '<div class="message error">Introdu numele produsului.</div>';

    return;

  }


  if(!Number.isFinite(price) || price < 0){

    message.innerHTML =
      '<div class="message error">Preț invalid.</div>';

    return;

  }


  if(!Number.isInteger(stock) || stock < 0){

    message.innerHTML =
      '<div class="message error">Stoc invalid.</div>';

    return;

  }


  var result = await sb
    .from("products")
    .insert({

      name:name,
      price:price,
      stock:stock,
      icon:icon,
      active:true

    });


  if(result.error){

    message.innerHTML =
      '<div class="message error">' +
      esc(result.error.message) +
      '</div>';

    console.error(result.error);

    return;

  }


  message.innerHTML =
    '<div class="message ok">Produs adăugat cu succes.</div>';


  document.getElementById("name").value = "";
  document.getElementById("price").value = "";
  document.getElementById("stock").value = "";
  document.getElementById("icon").value = "";


  await loadProducts();
  updateStats();

}


/* =========================
   SALVEAZĂ PRODUS
========================= */

async function saveProduct(id){

  var name =
    document.getElementById("name_" + id).value.trim();

  var price =
    Number(document.getElementById("price_" + id).value);

  var stock =
    Number(document.getElementById("stock_" + id).value);

  var icon =
    document.getElementById("icon_" + id).value.trim() || "🚗";


  var result = await sb
    .from("products")
    .update({

      name:name,
      price:price,
      stock:stock,
      icon:icon

    })
    .eq("id",id);


  if(result.error){

    alert(
      "Eroare:\n\n" +
      result.error.message
    );

    return;

  }


  alert("Produs salvat.");

  await loadProducts();

  updateStats();

}


/* =========================
   ACTIVEAZĂ / DEZACTIVEAZĂ
========================= */

async function toggleProduct(id,active){

  var result = await sb
    .from("products")
    .update({
      active:!active
    })
    .eq("id",id);


  if(result.error){

    alert(
      "Eroare:\n\n" +
      result.error.message
    );

    return;

  }


  await loadProducts();

  updateStats();

}


/* =========================
   COMENZI
========================= */

async function loadOrders(){

  var ordersResult =
    await sb
      .from("orders")
      .select("*")
      .order("created_at",{ascending:false});


  if(ordersResult.error){

    document.getElementById("orders").innerHTML =
      '<div class="message error">' +
      esc(ordersResult.error.message) +
      '</div>';

    console.error(ordersResult.error);

    return;

  }


  var itemsResult =
    await sb
      .from("order_items")
      .select("*");


  if(itemsResult.error){

    document.getElementById("orders").innerHTML =
      '<div class="message error">' +
      esc(itemsResult.error.message) +
      '</div>';

    console.error(itemsResult.error);

    return;

  }


  orders =
    ordersResult.data || [];

  orderItems =
    itemsResult.data || [];


  renderOrders();

}


function renderOrders(){

  var el =
    document.getElementById("orders");


  if(orders.length === 0){

    el.innerHTML =
      '<div class="loading">Nu există comenzi.</div>';

    return;

  }


  var html = "";


  orders.forEach(function(order){

    var items =
      orderItems.filter(function(item){

        return String(item.order_id) ===
          String(order.id);

      });


    var statusText = {

      new:"Nouă",
      confirmed:"Confirmată",
      shipped:"Expediată",
      completed:"Finalizată",
      cancelled:"Anulată"

    }[order.status] || order.status;


    html += `

      <div class="order">

        <div class="order-title">

          Comanda
          ${esc(order.order_number || order.id)}

        </div>

        <p style="color:#6b7280">
          ${dateFormat(order.created_at)}
        </p>


        <div class="order-info">

          <p>
            👤 <b>
            ${esc(order.customer_name)}
            </b>
          </p>

          <p>
            📞 ${esc(order.phone)}
          </p>

          <p>
            📧 ${esc(order.email || "-")}
          </p>

          <p>
            📍
            ${esc(order.county || "")},
            ${esc(order.city || "")},
            ${esc(order.address || "")}
          </p>

          <p>
            💳 ${esc(order.payment_method || "-")}
          </p>

        </div>


        <h3>Produse comandate</h3>

    `;


    if(items.length === 0){

      html +=
        "<p>Nu există produse asociate.</p>";

    }else{

      items.forEach(function(item){

        html += `

          <div class="order-item">

            <span>
              ${esc(item.name)}
              × ${item.quantity}
            </span>

            <span>
              ${money(
                Number(item.unit_price) *
                Number(item.quantity)
              )}
            </span>

          </div>

        `;

      });

    }


    html += `

        <div class="total">

          <span>Total</span>

          <span>
            ${money(order.total)}
          </span>

        </div>


        <div style="margin-top:15px">

          <select
            onchange="changeStatus('${order.id}',this.value)"
          >

            <option
              value="new"
              ${order.status==="new"?"selected":""}>
              Nouă
            </option>

            <option
              value="confirmed"
              ${order.status==="confirmed"?"selected":""}>
              Confirmată
            </option>

            <option
              value="shipped"
              ${order.status==="shipped"?"selected":""}>
              Expediată
            </option>

            <option
              value="completed"
              ${order.status==="completed"?"selected":""}>
              Finalizată
            </option>

            <option
              value="cancelled"
              ${order.status==="cancelled"?"selected":""}>
              Anulată
            </option>

          </select>

          <span style="margin-left:8px">
            ${esc(statusText)}
          </span>

        </div>

      </div>

    `;

  });


  el.innerHTML = html;

}


/* =========================
   SCHIMBĂ STATUS
========================= */

async function changeStatus(id,value){

  var result =
    await sb
      .from("orders")
      .update({
        status:value
      })
      .eq("id",id);


  if(result.error){

    alert(
      "Eroare:\n\n" +
      result.error.message
    );

    return;

  }


  await loadOrders();

  updateStats();

}


/* =========================
   STATISTICI
========================= */

function updateStats(){

  var active =
    products.filter(function(p){
      return p.active;
    }).length;


  var sales =
    orders
      .filter(function(o){
        return o.status !== "cancelled";
      })
      .reduce(function(total,o){

        return total + Number(o.total || 0);

      },0);


  document.getElementById(
    "statProducts"
  ).textContent =
    products.length;


  document.getElementById(
    "statActive"
  ).textContent =
    active;


  document.getElementById(
    "statOrders"
  ).textContent =
    orders.length;


  document.getElementById(
    "statSales"
  ).textContent =
    money(sales);

}


/* =========================
   ÎNCARCĂ TOT
========================= */

async function loadAll(){

  document.getElementById("products").innerHTML =
    '<div class="loading">Se încarcă produsele...</div>';

  document.getElementById("orders").innerHTML =
    '<div class="loading">Se încarcă comenzile...</div>';


  await loadProducts();

  await loadOrders();

  updateStats();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await sb.auth.signOut();

  location.reload();

}


/* =========================
   START
========================= */

loadAll();

</script>

</body>
</html>
