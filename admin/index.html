<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarZone Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#111827;
}

.wrap{
  width:min(1200px,94%);
  margin:auto;
  padding:25px 0 50px;
}

.login-box{
  max-width:420px;
  margin:80px auto;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.login-box h1{margin-top:0}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap:10px;
}

h1{margin:0;font-size:32px}
h2{margin-top:0}

.header-buttons{
  display:flex;
  gap:8px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  cursor:pointer;
  font-size:15px;
}

.primary{background:#2563eb;color:white}
.gray{background:#e5e7eb;color:#111}
.red{background:#dc2626;color:white}
.green{background:#16a34a;color:white}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:white;
  border-radius:16px;
  padding:18px;
}

.stat-title{
  color:#6b7280;
  font-size:14px;
}

.stat-number{
  font-size:28px;
  font-weight:bold;
  margin-top:7px;
}

.add-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:10px;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  background:white;
  font-size:16px;
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.product{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:16px;
}

.product-icon{
  font-size:35px;
  margin-bottom:10px;
}

.product-image{
  width:100%;
  height:180px;
  object-fit:contain;
  border-radius:12px;
  background:#f8fafc;
  margin-bottom:10px;
}

.product-name{
  font-size:18px;
  font-weight:bold;
  margin:8px 0 12px;
}

.product-fields{
  display:grid;
  gap:7px;
}

.product-buttons{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px;
}

.photo-box{
  margin-top:10px;
  padding:10px;
  background:#f9fafb;
  border-radius:10px;
}

.photo-box input{margin-bottom:7px}

.order{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
}

.order-title{
  font-weight:bold;
  font-size:18px;
}

.order-info{
  background:#f9fafb;
  border-radius:10px;
  padding:12px;
  margin-top:12px;
}

.order-info p{margin:6px 0}

.order-item{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #eee;
  padding:8px 0;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:19px;
  font-weight:bold;
  margin-top:12px;
}

.message{
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.ok{
  background:#dcfce7;
  color:#166534;
}

.loading{
  color:#6b7280;
  padding:10px 0;
}

.hidden{
  display:none !important;
}

@media(max-width:900px){
  .stats{grid-template-columns:1fr 1fr}
  .products{grid-template-columns:1fr 1fr}
  .add-grid{grid-template-columns:1fr 1fr}
}

@media(max-width:600px){
  .wrap{width:94%}

  .header{
    flex-direction:column;
    align-items:stretch;
  }

  .header-buttons button{flex:1}

  .stats{grid-template-columns:1fr 1fr}
  .products{grid-template-columns:1fr}
  .add-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="loginPage" class="login-box">

  <h1>CarZone Admin</h1>

  <p>Autentificare administrator</p>

  <input
    id="loginEmail"
    type="email"
    placeholder="Email"
    autocomplete="username"
  >

  <br><br>

  <input
    id="loginPassword"
    type="password"
    placeholder="Parolă"
    autocomplete="current-password"
  >

  <br><br>

  <button
    id="loginBtn"
    class="primary"
    style="width:100%"
  >
    🔐 Intră în panou
  </button>

  <div id="loginMessage"></div>

</div>


<div id="adminPage" class="wrap hidden">

  <div class="header">

    <div>
      <h1>CarZone Admin</h1>
      <p>Panoul de administrare</p>
    </div>

    <div class="header-buttons">

      <button id="refreshBtn" class="gray">
        🔄 Actualizează
      </button>

      <button id="logoutBtn" class="red">
        🚪 Ieșire
      </button>

    </div>

  </div>


  <div class="stats">

    <div class="stat">
      <div class="stat-title">Produse</div>
      <div id="statProducts" class="stat-number">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Produse active</div>
      <div id="statActive" class="stat-number">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Comenzi</div>
      <div id="statOrders" class="stat-number">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Vânzări</div>
      <div id="statSales" class="stat-number">0 lei</div>
    </div>

  </div>


  <div class="card">

    <h2>➕ Adaugă produs</h2>

    <div class="add-grid">

      <input id="name" placeholder="Nume produs">

      <input
        id="price"
        type="number"
        step="0.01"
        placeholder="Preț lei"
      >

      <input
        id="stock"
        type="number"
        placeholder="Stoc"
      >

      <input id="icon" placeholder="Emoji 🚗">

    </div>

    <button
      id="addProductBtn"
      class="primary"
      style="margin-top:10px"
    >
      Adaugă produs
    </button>

    <div id="productMessage"></div>

  </div>


  <div class="card">

    <h2>📦 Produse</h2>

    <div id="products">
      Se încarcă produsele...
    </div>

  </div>


  <div class="card">

    <h2>🛒 Comenzi</h2>

    <div id="orders">
      Se încarcă comenzile...
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>

<script>

(function(){

"use strict";


/* =========================
   VERIFICARE CONFIG
========================= */

var loginMessage =
  document.getElementById("loginMessage");

if(!window.supabase){

  loginMessage.innerHTML =
    '<div class="message error">' +
    'Supabase nu s-a încărcat. Verifică internetul și reîncarcă pagina.' +
    '</div>';

  return;

}


if(!window.CARZONE_CONFIG){

  loginMessage.innerHTML =
    '<div class="message error">' +
    'config.js nu a fost încărcat.' +
    '</div>';

  return;

}


var cfg = window.CARZONE_CONFIG;


if(!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY){

  loginMessage.innerHTML =
    '<div class="message error">' +
    'Configurația Supabase este incompletă.' +
    '</div>';

  return;

}


var sb = window.supabase.createClient(
  cfg.SUPABASE_URL,
  cfg.SUPABASE_ANON_KEY
);


var products = [];
var orders = [];
var orderItems = [];


/* =========================
   UTILITARE
========================= */

function money(value){

  return Number(value || 0).toLocaleString(
    "ro-RO",
    {
      style:"currency",
      currency:"RON"
    }
  );

}


function esc(value){

  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function dateFormat(value){

  if(!value) return "-";

  var d = new Date(value);

  if(isNaN(d.getTime())) return "-";

  return d.toLocaleString("ro-RO");

}


/* =========================
   LOGIN
========================= */

async function login(){

  var email =
    document.getElementById("loginEmail")
      .value
      .trim();

  var password =
    document.getElementById("loginPassword")
      .value;

  var message =
    document.getElementById("loginMessage");


  if(!email || !password){

    message.innerHTML =
      '<div class="message error">' +
      'Introdu emailul și parola.' +
      '</div>';

    return;

  }


  message.innerHTML =
    '<div class="message">' +
    'Se verifică datele...' +
    '</div>';


  try{

    var result =
      await sb.auth.signInWithPassword({

        email:email,
        password:password

      });


    if(result.error){

      message.innerHTML =
        '<div class="message error">' +
        esc(result.error.message) +
        '</div>';

      console.error(result.error);

      return;

    }


    await checkAdmin();

  }catch(error){

    console.error(error);

    message.innerHTML =
      '<div class="message error">' +
      esc(error.message || String(error)) +
      '</div>';

  }

}


/* =========================
   VERIFICARE ADMIN
========================= */

async function checkAdmin(){

  var message =
    document.getElementById("loginMessage");


  try{

    var sessionResult =
      await sb.auth.getSession();


    if(sessionResult.error){

      message.innerHTML =
        '<div class="message error">' +
        esc(sessionResult.error.message) +
        '</div>';

      return;

    }


    var session =
      sessionResult.data.session;


    if(!session){

      showLogin();

      return;

    }


    var adminResult =
      await sb
        .from("admin_users")
        .select("user_id")
        .eq("user_id",session.user.id)
        .maybeSingle();


    if(adminResult.error){

      console.error(adminResult.error);

      message.innerHTML =
        '<div class="message error">' +
        'Nu pot verifica drepturile de administrator: ' +
        esc(adminResult.error.message) +
        '</div>';

      await sb.auth.signOut();

      showLogin();

      return;

    }


    if(!adminResult.data){

      message.innerHTML =
        '<div class="message error">' +
        'Acest cont nu este administrator.' +
        '</div>';

      await sb.auth.signOut();

      showLogin();

      return;

    }


    document
      .getElementById("loginPage")
      .classList.add("hidden");


    document
      .getElementById("adminPage")
      .classList.remove("hidden");


    message.innerHTML = "";


    await loadAll();

  }catch(error){

    console.error(error);

    message.innerHTML =
      '<div class="message error">' +
      esc(error.message || String(error)) +
      '</div>';

  }

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  try{

    await sb.auth.signOut();

  }catch(error){

    console.error(error);

  }

  products = [];
  orders = [];
  orderItems = [];

  showLogin();

}


function showLogin(){

  document
    .getElementById("adminPage")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

}


/* =========================
   PRODUSE
========================= */

async function loadProducts(){

  var el =
    document.getElementById("products");


  el.innerHTML =
    '<div class="loading">Se încarcă produsele...</div>';


  try{

    var result =
      await sb
        .from("products")
        .select("*")
        .order("created_at",{ascending:false});


    if(result.error){

      el.innerHTML =
        '<div class="message error">' +
        esc(result.error.message) +
        '</div>';

      console.error(result.error);

      return;

    }


    products =
      result.data || [];


    renderProducts();


  }catch(error){

    console.error(error);

    el.innerHTML =
      '<div class="message error">' +
      esc(error.message || String(error)) +
      '</div>';

  }

}


function renderProducts(){

  var el =
    document.getElementById("products");


  if(products.length === 0){

    el.innerHTML =
      '<div class="loading">Nu există produse.</div>';

    return;

  }


  var html =
    '<div class="products">';


  products.forEach(function(p){

    html += `

      <div class="product">

        ${
          p.image_url
          ?
          `<img
            class="product-image"
            src="${esc(p.image_url)}"
            alt="${esc(p.name)}">`
          :
          `<div class="product-icon">
            ${esc(p.icon || "🚗")}
          </div>`
        }

        <div class="product-name">
          ${esc(p.name)}
        </div>

        <div class="product-fields">

          <input
            id="name_${esc(p.id)}"
            value="${esc(p.name)}"
            placeholder="Nume">

          <input
            id="price_${esc(p.id)}"
            type="number"
            step="0.01"
            value="${esc(p.price)}">

          <input
            id="stock_${esc(p.id)}"
            type="number"
            value="${esc(p.stock)}">

          <input
            id="icon_${esc(p.id)}"
            value="${esc(p.icon || "🚗")}"
            placeholder="Emoji">

        </div>


        <div class="photo-box">

          <b>🖼️ Poză produs</b>

          <input
            id="image_${esc(p.id)}"
            type="file"
            accept="image/*">

          <button
            class="primary upload-btn"
            data-id="${esc(p.id)}"
          >
            📷 Încarcă poza
          </button>

        </div>


        <p>

          ${
            p.active
            ?
            '<span style="color:#16a34a">● Activ</span>'
            :
            '<span style="color:#dc2626">● Dezactivat</span>'
          }

        </p>


        <div class="product-buttons">

          <button
            class="primary save-btn"
            data-id="${esc(p.id)}"
          >
            💾 Salvează
          </button>

          <button
            class="${p.active ? "red" : "green"} toggle-btn"
            data-id="${esc(p.id)}"
            data-active="${p.active}"
          >
            ${p.active ? "Dezactivează" : "Activează"}
          </button>

        </div>

      </div>

    `;

  });


  html += "</div>";

  el.innerHTML = html;


  document
    .querySelectorAll(".upload-btn")
    .forEach(function(btn){

      btn.addEventListener("click",function(){

        uploadImage(btn.dataset.id);

      });

    });


  document
    .querySelectorAll(".save-btn")
    .forEach(function(btn){

      btn.addEventListener("click",function(){

        saveProduct(btn.dataset.id);

      });

    });


  document
    .querySelectorAll(".toggle-btn")
    .forEach(function(btn){

      btn.addEventListener("click",function(){

        toggleProduct(
          btn.dataset.id,
          btn.dataset.active === "true"
        );

      });

    });

}


/* =========================
   ADAUGĂ PRODUS
========================= */

async function addProduct(){

  var name =
    document.getElementById("name")
      .value
      .trim();

  var price =
    Number(
      document.getElementById("price").value
    );

  var stock =
    Number(
      document.getElementById("stock").value
    );

  var icon =
    document.getElementById("icon")
      .value
      .trim() || "🚗";


  var message =
    document.getElementById("productMessage");


  if(!name){

    message.innerHTML =
      '<div class="message error">' +
      'Introdu numele produsului.' +
      '</div>';

    return;

  }


  if(!Number.isFinite(price) || price < 0){

    message.innerHTML =
      '<div class="message error">' +
      'Preț invalid.' +
      '</div>';

    return;

  }


  if(!Number.isInteger(stock) || stock < 0){

    message.innerHTML =
      '<div class="message error">' +
      'Stoc invalid.' +
      '</div>';

    return;

  }


  try{

    var result =
      await sb
        .from("products")
        .insert({

          name:name,
          price:price,
          stock:stock,
          icon:icon,
          active:true

        });


    if(result.error){

      message.innerHTML =
        '<div class="message error">' +
        esc(result.error.message) +
        '</div>';

      console.error(result.error);

      return;

    }


    message.innerHTML =
      '<div class="message ok">' +
      'Produs adăugat cu succes.' +
      '</div>';


    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("stock").value = "";
    document.getElementById("icon").value = "";


    await loadProducts();
    updateStats();

  }catch(error){

    console.error(error);

    message.innerHTML =
      '<div class="message error">' +
      esc(error.message || String(error)) +
      '</div>';

  }

}


/* =========================
   SALVEAZĂ PRODUS
========================= */

async function saveProduct(id){

  var name =
    document.getElementById("name_" + id)
      .value
      .trim();

  var price =
    Number(
      document.getElementById("price_" + id).value
    );

  var stock =
    Number(
      document.getElementById("stock_" + id).value
    );

  var icon =
    document.getElementById("icon_" + id)
      .value
      .trim() || "🚗";


  if(!name){

    alert("Numele produsului este obligatoriu.");

    return;

  }


  if(!Number.isFinite(price) || price < 0){

    alert("Preț invalid.");

    return;

  }


  if(!Number.isInteger(stock) || stock < 0){

    alert("Stoc invalid.");

    return;

  }


  try{

    var result =
      await sb
        .from("products")
        .update({

          name:name,
          price:price,
          stock:stock,
          icon:icon

        })
        .eq("id",id);


    if(result.error){

      alert(
        "Eroare:\n\n" +
        result.error.message
      );

      return;

    }


    alert("Produs salvat.");

    await loadProducts();
    updateStats();

  }catch(error){

    console.error(error);

    alert(
      "Eroare:\n\n" +
      (error.message || String(error))
    );

  }

}


/* =========================
   UPLOAD POZĂ
========================= */

async function uploadImage(id){

  var input =
    document.getElementById("image_" + id);


  if(!input){

    alert("Nu am găsit câmpul pentru poză.");

    return;

  }


  if(!input.files || !input.files[0]){

    alert("Alege mai întâi o poză.");

    return;

  }


  var file =
    input.files[0];


  if(!file.type.startsWith("image/")){

    alert("Fișierul trebuie să fie o imagine.");

    return;

  }


  if(file.size > 5 * 1024 * 1024){

    alert("Poza trebuie să aibă maximum 5 MB.");

    return;

  }


  var extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  var fileName =
    id + "-" + Date.now() + "." + extension;


  try{

    var upload =
      await sb.storage
        .from("products")
        .upload(
          fileName,
          file,
          {
            upsert:true,
            contentType:file.type
          }
        );


    if(upload.error){

      alert(
        "Eroare la încărcarea pozei:\n\n" +
        upload.error.message
      );

      console.error(upload.error);

      return;

    }


    var publicData =
      sb.storage
        .from("products")
        .getPublicUrl(fileName);


    var imageUrl =
      publicData.data.publicUrl;


    var update =
      await sb
        .from("products")
        .update({
          image_url:imageUrl
        })
        .eq("id",id);


    if(update.error){

      alert(
        "Poza a fost încărcată, dar nu am putut salva adresa:\n\n" +
        update.error.message
      );

      console.error(update.error);

      return;

    }


    alert("Poza a fost încărcată cu succes!");

    await loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "Eroare la încărcarea pozei:\n\n" +
      (error.message || String(error))
    );

  }

}


/* =========================
   ACTIVEAZĂ / DEZACTIVEAZĂ
========================= */

async function toggleProduct(id,active){

  try{

    var result =
      await sb
        .from("products")
        .update({
          active:!active
        })
        .eq("id",id);


    if(result.error){

      alert(
        "Eroare:\n\n" +
        result.error.message
      );

      return;

    }


    await loadProducts();
    updateStats();

  }catch(error){

    console.error(error);

    alert(
      "Eroare:\n\n" +
      (error.mes
