<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CarZone Admin</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  margin:0;
  color:#111;
}

.wrap{
  width:min(1100px,94%);
  margin:auto;
  padding:30px 0;
}

.box{
  background:white;
  padding:20px;
  border-radius:15px;
  margin:15px 0;
  box-sizing:border-box;
}

input,select{
  padding:12px;
  margin:5px 0;
  width:100%;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  padding:11px 16px;
  margin:5px 3px 5px 0;
  border:0;
  border-radius:9px;
  cursor:pointer;
  font-size:15px;
}

.primary{
  background:#2563eb;
  color:white;
}

.danger{
  background:#fee2e2;
  color:#991b1b;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
  white-space:pre-wrap;
}

.success{
  background:#dcfce7;
  color:#166534;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>CarZone Admin</h1>

<div id="login" class="box">

<h2>Autentificare</h2>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Parolă">

<button class="primary" onclick="login()">
Intră
</button>

<p id="msg"></p>

</div>


<div id="panel" style="display:none">

<div class="box">

<h2>Adaugă produs</h2>

<input id="name" placeholder="Nume produs">

<input id="price" type="number" step="0.01" placeholder="Preț lei">

<input id="stock" type="number" placeholder="Stoc">

<input id="icon" placeholder="Emoji">

<button class="primary" onclick="addProduct()">
Adaugă
</button>

<div id="productMessage"></div>

</div>


<div class="box">

<h2>Produse</h2>

<div id="products">
Se încarcă produsele...
</div>

</div>


<div class="box">

<h2>Comenzi</h2>

<div id="orders">
Se încarcă comenzile...
</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../config.js"></script>

<script>

const cfg = window.CARZONE_CONFIG;

const sb = window.supabase.createClient(
  cfg.SUPABASE_URL,
  cfg.SUPABASE_ANON_KEY
);


/* LOGIN */

async function login(){

  const emailValue =
    document.querySelector("#email").value.trim();

  const passwordValue =
    document.querySelector("#password").value;

  const msg =
    document.querySelector("#msg");

  msg.textContent = "Se conectează...";

  const { data, error } =
    await sb.auth.signInWithPassword({
      email: emailValue,
      password: passwordValue
    });

  if(error){

    msg.innerHTML =
      '<div class="error">' +
      error.message +
      '</div>';

    console.error(error);

    return;
  }

  msg.innerHTML =
    '<div class="success">Conectat.</div>';

  document.querySelector("#login").style.display =
    "none";

  document.querySelector("#panel").style.display =
    "block";

  await load();

}


/* VERIFICĂ SESIUNEA EXISTENTĂ */

async function checkSession(){

  const { data, error } =
    await sb.auth.getSession();

  if(error){

    console.error(error);

    return;
  }

  if(data.session){

    document.querySelector("#login").style.display =
      "none";

    document.querySelector("#panel").style.display =
      "block";

    await load();
  }

}


/* ÎNCARCĂ DATELE */

async function load(){

  const productsEl =
    document.querySelector("#products");

  const ordersEl =
    document.querySelector("#orders");


  productsEl.innerHTML =
    "Se încarcă produsele...";

  ordersEl.innerHTML =
    "Se încarcă comenzile...";


  /* PRODUSE */

  const {
    data: products,
    error: productsError
  } = await sb
    .from("products")
    .select("*")
    .order("created_at", {
      ascending:false
    });


  console.log("PRODUCTS:", products);

  console.log("PRODUCT ERROR:", productsError);


  if(productsError){

    productsEl.innerHTML =
      '<div class="error">' +
      'EROARE PRODUSE:\\n\\n' +
      productsError.message +
      '\\n\\nCod: ' +
      (productsError.code || "necunoscut") +
      '</div>';

  }else if(!products || products.length === 0){

    productsEl.innerHTML =
      '<div class="error">' +
      'Supabase a răspuns, dar lista produselor este goală.' +
      '</div>';

  }else{

    productsEl.innerHTML =
      products.map(x => `

        <div class="box">

          <h3>
            ${x.icon || "🚗"} ${x.name}
          </h3>

          <p>
            Preț actual:
            <b>${x.price} lei</b>
          </p>

          <p>
            Stoc:
            <b>${x.stock}</b>
          </p>

          <p>
            Activ:
            <b>${x.active ? "DA" : "NU"}</b>
          </p>

          <input
            id="p${x.id}"
            type="number"
            step="0.01"
            value="${x.price}"
          >

          <input
            id="s${x.id}"
            type="number"
            value="${x.stock}"
          >

          <button
            class="primary"
            onclick="updateP(${x.id})"
          >
            Salvează
          </button>

          <button
            class="danger"
            onclick="toggleP(${x.id},${x.active})"
          >
            ${x.active ? "Dezactivează" : "Activează"}
          </button>

        </div>

      `).join("");

  }


  /* COMENZI */

  const {
    data: orders,
    error: ordersError
  } = await sb
    .from("orders")
    .select("*")
    .order("created_at", {
      ascending:false
    });


  console.log("ORDERS:", orders);

  console.log("ORDER ERROR:", ordersError);


  if(ordersError){

    ordersEl.innerHTML =
      '<div class="error">' +
      'EROARE COMENZI:\\n\\n' +
      ordersError.message +
      '\\n\\nCod: ' +
      (ordersError.code || "necunoscut") +
      '</div>';

  }else if(!orders || orders.length === 0){

    ordersEl.innerHTML =
      '<p>Nu există comenzi momentan.</p>';

  }else{

    ordersEl.innerHTML =
      orders.map(x => `

        <div class="box">

          <h3>
            Comanda ${x.order_number || x.id}
          </h3>

          <p>
            <b>${x.customer_name}</b>
          </p>

          <p>
            Telefon:
            ${x.phone}
          </p>

          <p>
            Email:
            ${x.email || "-"}
          </p>

          <p>
            ${x.city},
            ${x.address}
          </p>

          <p>
            Total:
            <b>${x.total} lei</b>
          </p>

          <select
            onchange="status('${x.id}',this.value)"
          >

            <option value="new"
              ${x.status === "new" ? "selected" : ""}>
              Nouă
            </option>

            <option value="confirmed"
              ${x.status === "confirmed" ? "selected" : ""}>
              Confirmată
            </option>

            <option value="shipped"
              ${x.status === "shipped" ? "selected" : ""}>
              Expediată
            </option>

            <option value="completed"
              ${x.status === "completed" ? "selected" : ""}>
              Finalizată
            </option>

            <option value="cancelled"
              ${x.status === "cancelled" ? "selected" : ""}>
              Anulată
            </option>

          </select>

        </div>

      `).join("");

  }

}


/* ADAUGĂ PRODUS */

async function addProduct(){

  const productName =
    document.querySelector("#name").value.trim();

  const productPrice =
    Number(document.querySelector("#price").value);

  const productStock =
    Number(document.querySelector("#stock").value);

  const productIcon =
    document.querySelector("#icon").value.trim() || "🚗";

  const message =
    document.querySelector("#productMessage");


  if(!productName){

    message.innerHTML =
      '<div class="error">Introdu numele produsului.</div>';

    return;
  }


  const {
    error
  } = await sb
    .from("products")
    .insert({

      name:productName,

      price:productPrice,

      stock:productStock,

      icon:productIcon,

      active:true

    });


  if(error){

    message.innerHTML =
      '<div class="error">' +
      error.message +
      '</div>';

    console.error(error);

    return;
  }


  message.innerHTML =
    '<div class="success">Produs adăugat.</div>';


  document.querySelector("#name").value = "";

  document.querySelector("#price").value = "";

  document.querySelector("#stock").value = "";

  document.querySelector("#icon").value = "";


  await load();

}


/* MODIFICĂ PRODUS */

async function updateP(id){

  const price =
    Number(
      document.querySelector("#p" + id).value
    );

  const stock =
    Number(
      document.querySelector("#s" + id).value
    );


  const {
    error
  } = await sb
    .from("products")
    .update({
      price:price,
      stock:stock
    })
    .eq("id",id);


  if(error){

    alert(
      "Eroare:\\n" +
      error.message
    );

    console.error(error);

    return;
  }


  await load();

}


/* ACTIVE / INACTIV */

async function toggleP(id,active){

  const {
    error
  } = await sb
    .from("products")
    .update({
      active:!active
    })
    .eq("id",id);


  if(error){

    alert(
      "Eroare:\\n" +
      error.message
    );

    console.error(error);

    return;
  }


  await load();

}


/* STATUS COMANDĂ */

async function status(id,value){

  const {
    error
  } = await sb
    .from("orders")
    .update({
      status:value
    })
    .eq("id",id);


  if(error){

    alert(
      "Eroare:\\n" +
      error.message
    );

    console.error(error);

    return;
  }


  await load();

}


/* PORNEȘTE */

checkSession();

</script>

</body>
</html>
