<!doctype html>
<html lang="ro">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>CarZone Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#111827;
}

button,
input,
select{
  font:inherit;
}

.wrap{
  width:min(1200px,94%);
  margin:auto;
  padding:25px 0 50px;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.header h1{
  margin:0;
  font-size:32px;
}

.header p{
  margin:5px 0 0;
  color:#6b7280;
}

.header-actions{
  display:flex;
  gap:8px;
}

/* BUTTONS */

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  opacity:.9;
}

.primary{
  background:#2563eb;
  color:white;
}

.secondary{
  background:#e5e7eb;
  color:#111827;
}

.success{
  background:#16a34a;
  color:white;
}

.warning{
  background:#f59e0b;
  color:white;
}

.danger{
  background:#dc2626;
  color:white;
}

/* CARDS */

.box{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}

.box h2{
  margin-top:0;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}

.stat-label{
  color:#6b7280;
  font-size:14px;
  margin-bottom:8px;
}

.stat-value{
  font-size:28px;
  font-weight:bold;
}

/* FORMS */

.form-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:10px;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  outline:none;
  background:white;
}

input:focus,
select:focus{
  border-color:#2563eb;
}

/* PRODUCTS */

.products-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.product{
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:18px;
}

.product-top{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:15px;
}

.product-icon{
  width:55px;
  height:55px;
  border-radius:12px;
  background:#f3f4f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  flex-shrink:0;
}

.product-name{
  font-size:18px;
  font-weight:bold;
}

.product-status{
  font-size:13px;
  margin-top:5px;
}

.active{
  color:#16a34a;
}

.inactive{
  color:#dc2626;
}

.product-fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.product-fields .full{
  grid-column:1/-1;
}

.product-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
}

/* ORDERS */

.order{
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:18px;
  margin-bottom:12px;
}

.order-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.order-number{
  font-size:18px;
  font-weight:bold;
}

.order-date{
  color:#6b7280;
  font-size:13px;
  margin-top:4px;
}

.order-customer{
  margin-top:15px;
  background:#f9fafb;
  border-radius:12px;
  padding:14px;
}

.order-customer p{
  margin:6px 0;
}

.order-items{
  margin-top:15px;
}

.order-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.order-total{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  font-size:19px;
  font-weight:bold;
}

/* STATUS */

.status-new{
  background:#dbeafe;
  color:#1d4ed8;
}

.status-confirmed{
  background:#fef3c7;
  color:#92400e;
}

.status-shipped{
  background:#e0e7ff;
  color:#4338ca;
}

.status-completed{
  background:#dcfce7;
  color:#166534;
}

.status-cancelled{
  background:#fee2e2;
  color:#991b1b;
}

.status-badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  font-size:13px;
  font-weight:bold;
}

/* MESSAGES */

.message{
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

.message.error{
  background:#fee2e2;
  color:#991b1b;
}

.message.ok{
  background:#dcfce7;
  color:#166534;
}

.loading{
  color:#6b7280;
  padding:15px 0;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:30px;
  color:#6b7280;
}

/* MOBILE */

@media(max-width:900px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .products-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:650px){

  .wrap{
    width:94%;
    padding-top:18px;
  }

  .header{
    align-items:flex-start;
    flex-direction:column;
  }

  .header h1{
    font-size:28px;
  }

  .header-actions{
    width:100%;
  }

  .header-actions button{
    flex:1;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat{
    padding:15px;
  }

  .stat-value{
    font-size:22px;
  }

  .products-grid{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .box{
    padding:17px;
  }

  .order-header{
    flex-direction:column;
  }

}

</style>

</head>


<body>


<div class="wrap">


<!-- HEADER -->

<div class="header">

  <div>
    <h1>CarZone Admin</h1>
    <p>Panoul de administrare</p>
  </div>

  <div class="header-actions">

    <button
      class="secondary"
      onclick="loadAll()"
    >
      🔄 Actualizează
    </button>

    <button
      class="danger"
      onclick="logout()"
    >
      🚪 Ieșire
    </button>

  </div>

</div>


<!-- STATISTICI -->

<div class="stats">

  <div class="stat">

    <div class="stat-label">
      Produse
    </div>

    <div
      class="stat-value"
      id="statProducts"
    >
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-label">
      Produse active
    </div>

    <div
      class="stat-value"
      id="statActive"
    >
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-label">
      Comenzi
    </div>

    <div
      class="stat-value"
      id="statOrders"
    >
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-label">
      Valoare comenzi
    </div>

    <div
      class="stat-value"
      id="statSales"
    >
      0 lei
    </div>

  </div>

</div>


<!-- ADAUGĂ PRODUS -->

<div class="box">

  <h2>➕ Adaugă produs</h2>

  <div class="form-grid">

    <input
      id="name"
      placeholder="Nume produs"
    >

    <input
      id="price"
      type="number"
      step="0.01"
      placeholder="Preț lei"
    >

    <input
      id="stock"
      type="number"
      placeholder="Stoc"
    >

    <input
      id="icon"
      placeholder="Emoji 🚗"
    >

  </div>


  <button
    class="primary"
    onclick="addProduct()"
    style="margin-top:10px"
  >
    Adaugă produs
  </button>


  <div id="productMessage"></div>

</div>


<!-- PRODUSE -->

<div class="box">

  <h2>📦 Produse</h2>

  <div
    id="products"
    class="loading"
  >
    Se încarcă produsele...
  </div>

</div>


<!-- COMENZI -->

<div class="box">

  <h2>🛒 Comenzi</h2>

  <div
    id="orders"
    class="loading"
  >
    Se încarcă comenzile...
  </div>

</div>


</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../config.js"></script>


<script>


/* =========================
   CONFIGURARE
========================= */

const cfg = window.CARZONE_CONFIG;


const sb = window.supabase.createClient(
  cfg.SUPABASE_URL,
  cfg.SUPABASE_ANON_KEY
);


/* =========================
   DATE
========================= */

let products = [];

let orders = [];

let orderItems = [];


/* =========================
   UTILITARE
========================= */

function money(value){

  return Number(value || 0).toLocaleString(
    "ro-RO",
    {
      style:"currency",
      currency:"RON"
    }
  );

}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatDate(value){

  if(!value){
    return "-";
  }

  const d = new Date(value);

  return d.toLocaleString(
    "ro-RO",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* =========================
   LOGIN
========================= */

async function checkSession(){

  const {
    data,
    error
  } = await sb.auth.getSession();


  if(error){

    console.error(error);

    showLogin();

    return;
  }


  if(!data.session){

    showLogin();

    return;
  }


  await loadAll();

}


function showLogin(){

  document.body.innerHTML = `

    <div style="
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f4f6f8;
      padding:20px;
    ">

      <div style="
        background:white;
        padding:25px;
        border-radius:18px;
        width:min(420px,100%);
        box-shadow:0 5px 25px rgba(0,0,0,.08);
      ">

        <h1 style="margin-top:0">
          CarZone Admin
        </h1>

        <p style="color:#6b7280">
          Autentificare administrator
        </p>

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
          style="
            width:100%;
            padding:13px;
            margin:6px 0;
            border:1px solid #ccc;
            border-radius:10px;
          "
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Parolă"
          style="
            width:100%;
            padding:13px;
            margin:6px 0;
            border:1px solid #ccc;
            border-radius:10px;
          "
        >

        <button
          onclick="doLogin()"
          style="
            width:100%;
            padding:13px;
            margin-top:8px;
            background:#2563eb;
            color:white;
            border:0;
            border-radius:10px;
          "
        >
          Intră
        </button>

        <div
          id="loginMessage"
          style="margin-top:10px"
        ></div>

      </div>

    </div>

  `;

}


async function doLogin(){

  const email =
    document.querySelector("#loginEmail").value.trim();

  const password =
    document.querySelector("#loginPassword").value;


  const msg =
    document.querySelector("#loginMessage");


  msg.textContent =
    "Se conectează...";


  const {
    error
  } = await sb.auth.signInWithPassword({
    email,
    password
  });


  if(error){

    msg.innerHTML = `
      <div style="
        background:#fee2e2;
        color:#991b1b;
        padding:12px;
        border-radius:10px;
      ">
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  location.reload();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await sb.auth.signOut();

  location.reload();

}


/* =========================
   ÎNCARCĂ TOT
========================= */

async function loadAll(){

  document.querySelector("#products").innerHTML =
    '<div class="loading">Se încarcă produsele...</div>';

  document.querySelector("#orders").innerHTML =
    '<div class="loading">Se încarcă comenzile...</div>';


  await Promise.all([
    loadProducts(),
    loadOrders()
  ]);


  updateStats();

}


/* =========================
   PRODUSE
========================= */

async function loadProducts(){

  const {
    data,
    error
  } = await sb
    .from("products")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    document.querySelector("#products").innerHTML = `
      <div class="message error">
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  products = data || [];

  renderProducts();

}


/* =========================
   AFIȘARE PRODUSE
========================= */

function renderProducts(){

  const el =
    document.querySelector("#products");


  if(!products.length){

    el.innerHTML = `
      <div class="empty">
        Nu există produse.
      </div>
    `;

    return;
  }


  el.innerHTML = `

    <div class="products-grid">

      ${products.map(p => `

        <div class="product">

          <div class="product-top">

            <div class="product-icon">
              ${escapeHtml(p.icon || "🚗")}
            </div>

            <div>

              <div class="product-name">
                ${escapeHtml(p.name)}
              </div>

              <div class="
                product-status
                ${p.active ? "active" : "inactive"}
              ">
                ${p.active ? "● Activ" : "● Dezactivat"}
              </div>

            </div>

          </div>


          <div class="product-fields">

            <input
              id="name-${p.id}"
              class="full"
              value="${escapeHtml(p.name)}"
              placeholder="Nume"
            >

            <input
              id="price-${p.id}"
              type="number"
              step="0.01"
              value="${p.price}"
              placeholder="Preț"
            >

            <input
              id="stock-${p.id}"
              type="number"
              value="${p.stock}"
              placeholder="Stoc"
            >

            <input
              id="icon-${p.id}"
              value="${escapeHtml(p.icon || "🚗")}"
              placeholder="Emoji"
            >

          </div>


          <div class="product-actions">

            <button
              class="primary"
              onclick="updateProduct('${p.id}')"
            >
              💾 Salvează
            </button>


            <button
              class="${p.active ? "danger" : "success"}"
              onclick="toggleProduct('${p.id}',${p.active})"
            >
              ${p.active ? "Dezactivează" : "Activează"}
            </button>

          </div>

        </div>

      `).join("")}

    </div>

  `;

}


/* =========================
   ADAUGĂ PRODUS
========================= */

async function addProduct(){

  const name =
    document.querySelector("#name").value.trim();

  const price =
    Number(document.querySelector("#price").value);

  const stock =
    Number(document.querySelector("#stock").value);

  const icon =
    document.querySelector("#icon").value.trim() || "🚗";


  const message =
    document.querySelector("#productMessage");


  if(!name){

    message.innerHTML = `
      <div class="message error">
        Introdu numele produsului.
      </div>
    `;

    return;
  }


  if(!Number.isFinite(price) || price < 0){

    message.innerHTML = `
      <div class="message error">
        Introdu un preț valid.
      </div>
    `;

    return;
  }


  if(!Number.isInteger(stock) || stock < 0){

    message.innerHTML = `
      <div class="message error">
        Introdu un stoc valid.
      </div>
    `;

    return;
  }


  const {
    error
  } = await sb
    .from("products")
    .insert({

      name:name,

      price:price,

      stock:stock,

      icon:icon,

      active:true

    });


  if(error){

    console.error(error);

    message.innerHTML = `
      <div class="message error">
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  message.innerHTML = `
    <div class="message ok">
      Produsul a fost adăugat.
    </div>
  `;


  document.querySelector("#name").value = "";

  document.querySelector("#price").value = "";

  document.querySelector("#stock").value = "";

  document.querySelector("#icon").value = "";


  await loadProducts();

  updateStats();

}


/* =========================
   EDITEAZĂ PRODUS
========================= */

async function updateProduct(id){

  const name =
    document.querySelector("#name-" + id).value.trim();

  const price =
    Number(
      document.querySelector("#price-" + id).value
    );

  const stock =
    Number(
      document.querySelector("#stock-" + id).value
    );

  const icon =
    document.querySelector("#icon-" + id).value.trim() || "🚗";


  if(!name){

    alert("Numele produsului este obligatoriu.");

    return;
  }


  const {
    error
  } = await sb
    .from("products")
    .update({

      name:name,

      price:price,

      stock:stock,

      icon:icon

    })
    .eq(
      "id",
      id
    );


  if(error){

    alert(
      "Eroare la salvare:\n\n" +
      error.message
    );

    console.error(error);

    return;
  }


  await loadProducts();

  updateStats();

}


/* =========================
   ACTIVE / DEZACTIVEAZĂ
========================= */

async function toggleProduct(id,active){

  const {
    error
  } = await sb
    .from("products")
    .update({
      active:!active
    })
    .eq(
      "id",
      id
    );


  if(error){

    alert(
      "Eroare:\n\n" +
      error.message
    );

    console.error(error);

    return;
  }


  await loadProducts();

  updateStats();

}


/* =========================
   COMENZI
========================= */

async function loadOrders(){

  const [
    ordersResult,
    itemsResult
  ] = await Promise.all([

    sb
      .from("orders")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      ),

    sb
      .from("order_items")
      .select("*")

  ]);


  if(ordersResult.error){

    console.error(ordersResult.error);

    document.querySelector("#orders").innerHTML = `
      <div class="message error">
        ${escapeHtml(ordersResult.error.message)}
      </div>
    `;

    return;
  }


  if(itemsResult.error){

    console.error(itemsResult.error);

    document.querySelector("#orders").innerHTML = `
      <div class="message error">
        Comenzile există, dar produsele comenzilor nu pot fi citite:
        <br><br>
        ${escapeHtml(itemsResult.error.message)}
      </div>
    `;

    return;
  }


  orders =
    ordersResult.data || [];

  orderItems =
    itemsResult.data || [];


  renderOrders();

}


/* =========================
   AFIȘARE COMENZI
========================= */

function renderOrders(){

  const el =
    document.querySelector("#orders");


  if(!orders.length){

    el.innerHTML = `
      <div class="empty">
        Nu există comenzi momentan.
      </div>
    `;

    return;
  }


  el.innerHTML =
    orders.map(order => {

      const items =
        orderItems.filter(
          item =>
            String(item.order_id) ===
            String(order.id)
        );


      const statusClass =
        "status-" +
        (order.status || "new");


      const statusText = {

        new:"Nouă",

        confirmed:"Confirmată",

        shipped:"Expediată",

        completed:"Finalizată",

        cancelled:"Anulată"

      }[order.status] || order.status;


      return `

        <div class="order">


          <div class="order-header">

            <div>

              <div class="order-number">

                ${escapeHtml(
                  order.order_number ||
                  order.id
                )}

              </div>

              <div class="order-date">

                ${formatDate(
                  order.created_at
                )}

              </div>

            </div>


            <div>

              <span
                class="status-badge ${statusClass}"
              >
                ${escapeHtml(statusText)}
              </span>

            </div>

          </div>


          <div class="order-customer">

            <p>
              👤
              <b>
                ${escapeHtml(order.customer_name)}
              </b>
            </p>

            <p>
              📞
              ${escapeHtml(order.phone)}
            </p>

            <p>
              📧
              ${escapeHtml(order.email || "-")}
            </p>

            <p>
              📍
              ${escapeHtml(order.county || "")},
              ${escapeHtml(order.city ||
