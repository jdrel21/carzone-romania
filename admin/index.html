<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarZone Admin</title><style>body{font-family:Arial;background:#f5f6f8;margin:0}.wrap{width:min(1100px,94%);margin:auto;padding:30px}.box{background:white;padding:20px;border-radius:15px;margin:15px 0}input,select{padding:10px;margin:4px;width:calc(100% - 8px);box-sizing:border-box}button{padding:10px 14px;margin:4px;border:0;border-radius:9px;cursor:pointer}.primary{background:#2563eb;color:white}.danger{background:#fee2e2}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>CarZone Admin</h1><div id="login" class="box"><h2>Autentificare</h2><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Parolă"><button class="primary" onclick="login()">Intră</button><p id="msg"></p></div><div id="panel" style="display:none"><div class="box"><h2>Adaugă produs</h2><input id="name" placeholder="Nume"><input id="price" type="number" step=".01" placeholder="Preț lei"><input id="stock" type="number" placeholder="Stoc"><input id="icon" placeholder="Emoji"><button class="primary" onclick="addProduct()">Adaugă</button></div><div class="box"><h2>Produse</h2><div id="products" class="grid"></div></div><div class="box"><h2>Comenzi</h2><div id="orders"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script>
const sb=supabase.createClient(CARZONE_CONFIG.SUPABASE_URL,CARZONE_CONFIG.SUPABASE_ANON_KEY);
async function login(){let {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});msg.textContent=error?error.message:'Conectat';if(!error){loginDiv=document.querySelector('#login');loginDiv.style.display='none';document.querySelector('#panel').style.display='block';load()}}
async function load(){let p=await sb.from('products').select('*').order('created_at',{ascending:false});document.querySelector('#products').innerHTML=(p.data||[]).map(x=>`<div class="box"><b>${x.name}</b><p>${x.price} lei · stoc ${x.stock}</p><input id="p${x.id}" type="number" step=".01" value="${x.price}"><input id="s${x.id}" type="number" value="${x.stock}"><button onclick="updateP(${x.id})">Salvează</button><button class="danger" onclick="toggleP(${x.id},${x.active})">${x.active?'Dezactivează':'Activează'}</button></div>`).join('');let o=await sb.from('orders').select('*').order('created_at',{ascending:false});document.querySelector('#orders').innerHTML=(o.data||[]).map(x=>`<div class="box"><b>${x.order_number}</b><p>${x.customer_name} · ${x.phone} · ${x.total} lei</p><p>${x.city}, ${x.address}</p><select onchange="status(${x.id},this.value)"><option ${x.status==='new'?'selected':''}>new</option><option ${x.status==='confirmed'?'selected':''}>confirmed</option><option ${x.status==='shipped'?'selected':''}>shipped</option><option ${x.status==='completed'?'selected':''}>completed</option><option ${x.status==='cancelled'?'selected':''}>cancelled</option></select></div>`).join('')}
async function addProduct(){await sb.from('products').insert({name:name.value,price:Number(price.value),stock:Number(stock.value),icon:icon.value||'🚗',active:true});load()}
async function updateP(id){await sb.from('products').update({price:Number(document.querySelector('#p'+id).value),stock:Number(document.querySelector('#s'+id).value)}).eq('id',id);load()}
async function toggleP(id,a){await sb.from('products').update({active:!a}).eq('id',id);load()}
async function status(id,v){await sb.from('orders').update({status:v}).eq('id',id);load()}
</script></body></html>
